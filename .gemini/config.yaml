version: 1

# Исключаем служебные папки и сгенерированные файлы, чтобы не тратить лимиты бота
ignore:
  - "dist/**"
  - "build/**"
  - "node_modules/**"
  - ".git/**"
  - "**/*.min.js"
  - "**/*.min.css"

# Задаем порог: показывать только средние и критические проблемы
review:
  severity_threshold: "medium"